apiVersion: v1
kind: Pod
metadata:
  name: giropops
  labels:
    app: giropops
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - name: nginx-http
          containerPort: 80
          protocol: TCP
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

    - name: apache
      image: httpd:2.4
      command:
        - /bin/sh
        - -ec
      args:
        - |
          sed -i 's/^Listen 80$/Listen 8080/' /usr/local/apache2/conf/httpd.conf
          exec httpd-foreground
      ports:
        - name: apache-http
          containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
